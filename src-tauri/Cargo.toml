# The desktop shell supervises system Node; application services remain in TypeScript.
[package]
name = "shiqu-desktop"
version = "0.1.0"
description = "Shiqu Lite desktop control panel"
edition = "2021"
rust-version = "1.93"

[lib]
name = "shiqu_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
