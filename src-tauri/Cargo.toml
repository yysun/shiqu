# Native settings/credentials stay in private SQLite; the shell supervises bundled or system Node.
[package]
name = "shiqu-desktop"
version = "0.3.0"
description = "Shiqu desktop control panel"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.93"

[lib]
name = "shiqu_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# The default Tauri config enables this; Lite's override deliberately clears it.
[features]
default = []
bundled-node = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4.3"
sha2 = "0.10"
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
