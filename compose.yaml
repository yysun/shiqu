name: shiqu
services:
  shiqu:
    image: shiqu:local
    build:
      context: .
      target: runtime
    init: true
    user: "${SHIQU_UID:-1000}:${SHIQU_GID:-1000}"
    ports:
      - "127.0.0.1:${SHIQU_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      SHIQU_DATA_DIR: /data
      SHIQU_BIND_IP: 0.0.0.0
    volumes:
      - type: bind
        source: ${SHIQU_HOST_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
