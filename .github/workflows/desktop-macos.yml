# Build native unsigned macOS packages; publish complete tag builds with stable download names.
name: Desktop macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['client/**', 'public/**', 'desktop/**', 'src-tauri/**', 'server/**', 'lib/**', 'components/**', 'db/**', 'drizzle/**', 'data/library/**', 'docker/seed.sql', 'scripts/**', 'tests/**', '*.config.*', 'tsconfig.json', '.nvmrc', 'package.json', 'pnpm-lock.yaml', '.github/workflows/desktop-macos.yml']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.edition }} / macOS arm64
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, lite]
    runs-on: macos-15
    env:
      EDITION: ${{ matrix.edition }}
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          architecture: arm64
      - name: Check native architecture and release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          assert.equal(process.arch, process.env.ARCH, 'Node must match the native runner architecture');
          if (process.env.EVENT_NAME === 'push') {
            const tag = process.env.RELEASE_TAG;
            assert.match(tag, /^v\d+\.\d+\.\d+$/, 'Release tags must use vX.Y.Z (no prereleases)');
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              assert.equal(JSON.parse(readFileSync(file, 'utf8')).version, tag.slice(1), `${file} must match ${tag}`);
            }
            const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m);
            assert.equal(cargo?.[1], tag.slice(1), `src-tauri/Cargo.toml must match ${tag}`);
          }
          NODE
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Prepare edition resources for native tests
        run: |
          if [[ "$EDITION" == lite ]]; then
            pnpm run desktop:prepare:lite
          else
            pnpm run desktop:prepare
          fi
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native tests
        run: |
          if [[ "$EDITION" == lite ]]; then
            pnpm run desktop:test:lite
          else
            pnpm run desktop:test
          fi
      - name: Build unsigned Standard DMG
        if: matrix.edition == 'standard'
        run: pnpm run desktop:build --ci --no-sign --bundles dmg
      - name: Build unsigned Lite DMG
        if: matrix.edition == 'lite'
        run: pnpm run desktop:build:lite --ci --no-sign --bundles dmg
      - name: Smoke test the packaged application resources
        run: |
          app_name=Shiqu
          if [[ "$EDITION" == lite ]]; then app_name='Shiqu Lite'; fi
          pnpm run desktop:smoke "src-tauri/target/release/bundle/macos/$app_name.app/Contents/Resources/runtime"
      - name: Give the installer a stable download name
        run: |
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo 'Expected exactly one DMG for this edition and architecture' >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${installers[0]}" "release-assets/shiqu-$EDITION-macos-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: shiqu-${{ matrix.edition }}-macos-arm64
          path: release-assets/*.dmg
          if-no-files-found: error

  release:
    name: Publish macOS release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shiqu-*-macos-*
          merge-multiple: true
          path: release-assets
      - name: Verify all downloads and generate checksums
        working-directory: release-assets
        run: |
          for edition in standard lite; do
            test -s "shiqu-$edition-macos-arm64.dmg"
          done
          shasum -a 256 shiqu-*-macos-*.dmg > SHA256SUMS.txt
      - name: Upload all installers before publishing
        working-directory: release-assets
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/shiqu-release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/shiqu-release-draft")" != true ]]; then
              echo 'This release is already published; refusing to replace its downloads' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Shiqu $RELEASE_TAG" --generate-notes \
              --notes 'Unsigned macOS installers for Apple Silicon (arm64). Standard includes Node; Lite requires Node 24. macOS 13.5 or later is required. These apps are not notarized; macOS may require approval in System Settings > Privacy & Security. SHA-256 checksums are included in SHA256SUMS.txt.'
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
