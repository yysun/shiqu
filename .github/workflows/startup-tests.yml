# Test startup with disposable homes/databases only; no deployment, installer build, secrets or live inference.
name: Startup configuration

on:
  push:
    branches: ['main', 'codex/**']
    paths: ['tests/**', 'server/**', 'lib/**', 'drizzle/**', 'docker/seed.sql', 'package.json', 'pnpm-lock.yaml', '.nvmrc', '.github/workflows/startup-tests.yml']
  pull_request:
    paths: ['tests/**', 'server/**', 'lib/**', 'drizzle/**', 'docker/seed.sql', 'package.json', 'pnpm-lock.yaml', '.nvmrc', '.github/workflows/startup-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Startup / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Startup matrix and database failure recovery
        run: pnpm run test:startup
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.13'
      - name: Real terminal setup, cancellation, configure and reset
        if: runner.os != 'Windows'
        run: pnpm run test:pty
