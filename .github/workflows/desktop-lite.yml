# Build each desktop target on its own OS; artifacts are unsigned and never published automatically.
name: Desktop Lite
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'src-tauri/**', 'server/**', 'lib/**', 'db/**', 'drizzle/**', 'data/library/**', 'scripts/desktop-resources.mjs', 'package.json', 'pnpm-lock.yaml', '.github/workflows/desktop-lite.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: pnpm desktop:test
      - run: pnpm desktop:build --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: shiqu-lite-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error
