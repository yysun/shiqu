<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193f35"><title>拾趣 · 离线书架</title><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#25372f;font:15px/1.7 system-ui,sans-serif}header,main{max-width:660px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd8cc}a{color:inherit}h1,h2{font-family:serif}h1{font-size:26px;margin:24px 0 8px}p{color:#7b8074}button{border:1px solid #d4d7cb;background:transparent;color:#193f35;padding:12px 18px;border-radius:8px;cursor:pointer;font:inherit}button.primary{background:#193f35;color:white}button:disabled{opacity:.4}article{margin:20px 0;padding:18px;border:1px solid #dcdccf;border-radius:12px;display:flex;gap:18px;align-items:center}article img{width:90px;border-radius:5px}article h2{font-size:20px;margin:0}article small{color:#7b8074}.caption{white-space:pre-line;font:600 25px/1.6 serif;margin:0;padding:26px 22px;background:#fffdf8;color:#233a31}.picture{display:block;width:100%}.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.foot small{color:#7b8074}audio{width:100%;margin-top:10px}.fine{font-size:12px}#clear{margin-top:22px}.ending{background:#e9eddf;padding:24px;border-radius:10px}</style></head><body><header><strong>拾趣 <small> / 离线书架</small></strong><a href="/read">返回在线</a></header><main id="app"></main><script>
const app=document.querySelector('#app');let current=null,page=0;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(text,action,cls){const b=el('button',text,cls);b.onclick=action;return b;}
async function shelf(){app.replaceChildren(el('h1','存下的故事，随时翻翻。'),el('p','离线阅读保存在本机，暂不计入验证数据。'));try{const c=await caches.open('yiyu-offline-v1');const keys=(await c.keys()).filter(k=>new URL(k.url).pathname.startsWith('/offline-data/'));if(!keys.length)app.append(el('p','还没有离线故事。联网打开一篇故事，点击“离线保存”。'));for(const key of keys){const s=await(await c.match(key)).json();const card=el('article');const img=el('img');img.src=s.pages[0].image;img.alt='';const info=el('div');info.append(el('h2',s.title),el('p',s.pages.length+'页 · '+s.theme),button('翻开故事',()=>{current=s;page=0;read();},'primary'));card.append(img,info);app.append(card);}if(keys.length){const clear=button('清空本机离线内容',async()=>{if(confirm('将删除本机保存的所有离线故事，服务器上的内容不受影响。')){await caches.delete('yiyu-offline-v1');shelf();}});clear.id='clear';app.append(clear);}}catch{app.append(el('p','此浏览器暂不支持离线存储，请返回在线阅读。'));}}
function read(){const p=current.pages[page];app.replaceChildren();app.append(button('← 离线书架',shelf),el('h1',current.title),el('p',p.caption,'caption'));const img=el('img');img.src=p.image;img.alt=p.caption;img.className='picture';app.append(img);const nav=el('div',undefined,'foot');const prev=button('上一页',()=>{page--;read();});prev.disabled=page===0;nav.append(prev,el('small',(page+1)+' / '+current.pages.length),button(page===current.pages.length-1?'读完了':'下一页',()=>{if(page<current.pages.length-1){page++;read();}else{app.replaceChildren(el('h1','合上故事，想一想。'),el('p',current.reflection,'ending'),button('回到离线书架',shelf,'primary'));}},'primary'));app.append(nav,el('p','AI 生成画面 · 古典原文改编','fine'));window.scrollTo(0,0);}
shelf();
</script></body></html>
